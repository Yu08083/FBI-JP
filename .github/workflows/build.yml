name: Build FBI Japanese

on:
  push:
    branches:
      - codex/japanese
    tags:
      - '*-ja.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Check localization, layout and updates
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get update
          apt-get install -y --no-install-recommends libjansson-dev
          python3 tests/verify.py
          python3 tests/verify_http.py
          python3 tests/verify_update.py
          python3 tests/verify_update.py 2.6.1-ja.3
          python3 tests/verify_update.py '2.6.1-ja.3+20261023'
          python3 tests/verify_text.py
          python3 tests/verify_text_io.py
          python3 tests/verify_editor.py
          python3 tests/verify_download_ui.py
      - name: Prepare packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends xxd
          curl -fL --retry 3 https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip -o /tmp/bannertool.zip
          echo '69768596f836acb3e3aeaa66e47c6ba560dde813c6dfcd33c8afc25fe29b7524  /tmp/bannertool.zip' | sha256sum -c -
          unzip -q /tmp/bannertool.zip -d /tmp/bannertool
          install -m 755 /tmp/bannertool/linux-x86_64/bannertool /usr/local/bin/bannertool
          git clone --depth 1 --branch makerom-v0.18.4 https://github.com/3DSGuy/Project_CTR.git /tmp/project-ctr
          test "$(git -C /tmp/project-ctr rev-parse HEAD)" = c0488dcb6c3048e6a519716f2b21e2c65859ca75
          make -C /tmp/project-ctr/makerom deps
          make -C /tmp/project-ctr/makerom -j2
          install -m 755 /tmp/project-ctr/makerom/bin/makerom /usr/local/bin/makerom
      - name: Build CIA and 3DSX
        run: |
          make -j2 output/3ds-arm/FBI.cia output/3ds-arm/3ds/FBI/FBI.3dsx
          python3 tests/verify_cia.py output/3ds-arm/FBI.cia
          python3 tests/verify_smdh.py output/3ds-arm/FBI.cia output/3ds-arm/3ds/FBI/FBI.3dsx build/3ds-arm/meta.smdh
          mkdir -p dist
          cp output/3ds-arm/FBI.cia dist/FBI-JP.cia
          cp output/3ds-arm/3ds/FBI/FBI.3dsx dist/FBI-JP.3dsx
          cp build/3ds-arm/meta.smdh dist/FBI-JP.smdh
          cp LICENSE.txt README.md dist/
          cp LICENSES/stb_image.txt dist/LICENSE-stb_image.txt
          cp source/libs/quirc/LICENSE dist/LICENSE-quirc.txt
          dkp-pacman -Q > dist/build-packages.txt
          printf '%s\n' "$GITHUB_SHA" > dist/source-commit.txt
          cd dist
          sha256sum FBI-JP.cia FBI-JP.3dsx FBI-JP.smdh > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: FBI-JP-${{ github.sha }}
          path: dist/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: FBI-JP-${{ github.sha }}
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --latest --title "FBI 日本語版 ${GITHUB_REF_NAME%%+*}" --notes-file RELEASE_NOTES.md
